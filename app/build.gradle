plugins {
    id 'com.android.application'
}

def releaseKeystoreFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'org.axon.dockit'
    compileSdk 35

    defaultConfig {
        applicationId 'org.axon.dockit'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        if (releaseKeystoreFile != null && !releaseKeystoreFile.isBlank()) {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystoreFile != null && !releaseKeystoreFile.isBlank()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
